name: Debug build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
          ls "$ANDROID_HOME/platforms" || true
      - name: Build debug APK
        run: ./gradlew :gearslip:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSpace-debug-apk
          path: build/AutoSpace-debug.apk
      - name: Run unit tests
        run: ./gradlew :gearslip:testDebugUnitTest --stacktrace
