name: Unit tests

# r45 (2026-10-26, Robert: no more debug builds): this workflow used to build
# and publish a debug APK. It no longer does — it runs the unit tests only.
# release.yml runs no tests, so this is the only test gate on pushes to main;
# keep the test step intact. Release builds come from tagged v* pushes via
# release.yml, and every build ships as a prerelease from 0.4.1-alpha on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform 37
        # API 37 (Android 17, "Cinnamon Bun") is a preview platform: the stable
        # repository only lists up to android-36, and sdkmanager's
        # "platforms;android-37" only works where the runner already ships it.
        # So: keep an existing android-37 if the runner has one; otherwise
        # download the preview platform zip (platform-CinnamonBun) and install
        # it as platforms/android-37. Never overwrite an existing platform.
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "platform android-37 already present, keeping it"
          else
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "falling back to Cinnamon Bun preview platform zip"
            curl -sL -o /tmp/platform-CinnamonBun.zip https://dl.google.com/android/repository/platform-CinnamonBun_r02.zip
            mkdir -p /tmp/cb && unzip -q -o /tmp/platform-CinnamonBun.zip -d /tmp/cb
            cp -r /tmp/cb/android-37.1-beta2 "$ANDROID_HOME/platforms/android-37"
          fi
          ls "$ANDROID_HOME/platforms"
      - name: Run unit tests
        run: ./gradlew :gearslip:testDebugUnitTest --stacktrace
