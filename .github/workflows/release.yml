name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch oboe (pinned, r93)
        run: |
          mkdir -p third_party/oboe
          curl -sL -o /tmp/oboe.tar.gz https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz
          echo "e030276d25b8bdfaeb04f66646821b1ba4a2b6a580a7e84fb144a478eaecd663  /tmp/oboe.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oboe.tar.gz -C third_party/oboe --strip-components=1

      - name: Write signing key and properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > gearslip-release.jks
          cat > keystore.properties <<EOF
          storeFile=gearslip-release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: |
          if [[ "${{ github.ref_name }}" == *"-exp"* ]]; then
            ./gradlew :gearslip:assembleExperimentalRelease
          else
            ./gradlew :gearslip:assembleStandardRelease
          fi

      - name: Locate APK
        id: apk
        run: |
          # The build moves its APKs to <root>/build/AutoSpace-<variant>.apk (see renameApk).
          if [[ "${{ github.ref_name }}" == *"-exp"* ]]; then
            apk=build/AutoSpace-experimental.apk
          else
            apk=build/AutoSpace-release.apk
          fi
          test -f "$apk" || { echo "no APK at $apk"; ls -R build | head -50; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Choose release notes
        id: notes
        run: |
          # r221: experimental tags get their own notes file, so the beta
          # notes are never overwritten with experimental content.
          if [[ "${{ github.ref_name }}" == *"-exp"* ]]; then
            echo "path=.github/release-notes-experimental.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=.github/release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          # The hand-written notes go first; GitHub adds the full changelog link under them.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          # Every release starts as a pre-release: only phones on the Alpha update channel get it.
          # Once it's tested, untick pre-release on GitHub and everyone gets it.
          prerelease: true
