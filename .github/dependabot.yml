# Weekly pull requests for newer Gradle libraries and GitHub Actions, aimed at main,
# where current code lands. Security fixes come separately, as soon as an alert opens.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
